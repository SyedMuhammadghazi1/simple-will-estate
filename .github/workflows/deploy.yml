name: Deploy

on:
  # Deploy only commits that passed CI: runs when the CI workflow finishes for a push to main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build & push image
    # Never for pull requests (including forks whose branch is also called "main").
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      sha: ${{ steps.name.outputs.sha }}
    steps:
      - name: Image name (GHCR requires lowercase) and the commit CI tested
        id: name
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.name.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.sha }}
            ${{ steps.name.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'Plainwill' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run database migrations
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Skip when not configured
        if: env.PRODUCTION_DATABASE_URL == ''
        run: echo "::notice::PRODUCTION_DATABASE_URL is not set — skipping migrations."

      - uses: docker/login-action@v3
        if: env.PRODUCTION_DATABASE_URL != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply migrations
        if: env.PRODUCTION_DATABASE_URL != ''
        run: |
          docker run --rm -e DATABASE_URL="$PRODUCTION_DATABASE_URL" \
            "${{ needs.image.outputs.image }}:${{ needs.image.outputs.sha }}" node migrate.mjs

  deploy:
    name: Deploy
    needs: [image, migrate]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - name: Skip when not configured
        if: env.DEPLOY_HOOK_URL == ''
        run: echo "::notice::DEPLOY_HOOK_URL is not set — skipping deploy. Image ${{ needs.image.outputs.image }}:${{ needs.image.outputs.sha }} is published."

      - name: Trigger deploy hook
        if: env.DEPLOY_HOOK_URL != ''
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK_URL" \
            --data-urlencode "image=${{ needs.image.outputs.image }}:${{ needs.image.outputs.sha }}" \
            -o /dev/null -w "deploy hook responded %{http_code}\n"
